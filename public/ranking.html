<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking — TypeGP</title>
  <meta name="description" content="Ranking global dos melhores digitadores do TypeGP." />
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/"><i data-lucide="flag" class="icon icon-lg flag"></i>Type<span class="gp">GP</span></a>
      <nav>
        <a href="/"><i data-lucide="play" class="icon"></i>Jogar</a>
        <a href="/profile.html"><i data-lucide="user" class="icon"></i>Meu perfil</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"></button>
      </nav>
    </header>

    <div class="panel">
      <h1><i data-lucide="trophy" class="icon"></i>Ranking global</h1>
      <p class="sub">Os pilotos mais rápidos, por melhor PPM (palavras por minuto).</p>
      <div id="tableWrap"></div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/theme-toggle.js"></script>
  <script src="/js/ranking.js"></script>
  <script>lucide.createIcons();</script>

</html>
