<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="profile.title">Perfil — Tekla</title>
  <meta name="description" content="Estatísticas e histórico de corridas no Tekla." data-i18n-content="profile.description" />
  <script src="/js/i18n.js"></script>
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/"><i data-lucide="flag" class="icon icon-lg flag"></i><span class="brand-text">Te<span class="brand-hi">kla</span></span></a>
      <nav>
        <a href="/ranking"><i data-lucide="trophy" class="icon"></i><span data-i18n="nav.ranking">Ranking</span></a>
        <a href="/"><i data-lucide="play" class="icon"></i><span data-i18n="nav.play">Jogar</span></a>
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"></button>
      </nav>
    </header>

    <div class="panel">
      <h1 id="profileTitle" data-i18n="profile.defaultHeading">Perfil</h1>
      <p class="sub" id="profileSub"></p>

      <div class="stats-row" id="summaryStats"></div>

      <h2 style="margin-top:28px;"><i data-lucide="history" class="icon"></i><span data-i18n="profile.historyHeading">Histórico de corridas</span></h2>
      <div id="historyWrap"></div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/theme-toggle.js"></script>
  <script src="/js/profile.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
