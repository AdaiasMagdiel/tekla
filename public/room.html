<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="room.title">Sala — Tekla</title>
  <meta name="robots" content="noindex" />
  <script src="/js/i18n.js"></script>
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/"><i data-lucide="flag" class="icon icon-lg flag"></i><span class="brand-text">Te<span class="brand-hi">kla</span></span></a>
      <nav>
        <a href="/ranking"><i data-lucide="trophy" class="icon"></i><span data-i18n="nav.ranking">Ranking</span></a>
        <a href="/profile"><i data-lucide="user" class="icon"></i><span data-i18n="nav.profile">Meu perfil</span></a>
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"></button>
      </nav>
    </header>

    <div class="panel">
      <div class="room-header">
        <div>
          <h1 style="margin-bottom:4px;"><span data-i18n="room.roomLabel">Sala</span> <code class="room-code" id="roomCodeLabel">------</code></h1>
          <div class="room-code-display copy-hint" id="copyHint"><i data-lucide="copy" class="icon"></i><span id="copyHintText" data-i18n="room.copyHint">clique para copiar o link do convite</span></div>
          <div class="room-code-display"><a href="#" id="mirrorLink" target="_blank" style="color:inherit; display:inline-flex; align-items:center; gap:6px;"><i data-lucide="tv" class="icon"></i><span data-i18n="room.mirrorLink">abrir modo telão</span></a></div>
        </div>
        <div id="startControls" style="display:none; gap:8px; align-items:center;">
          <select id="difficultySelect">
            <option value="easy" data-i18n="room.difficultyEasy">Fácil</option>
            <option value="medium" selected data-i18n="room.difficultyMedium">Médio</option>
            <option value="hard" data-i18n="room.difficultyHard">Difícil</option>
          </select>
          <button class="btn btn-primary" id="startBtn" data-i18n="room.startButton">Começar corrida</button>
        </div>
        <div id="waitingHostMsg" class="room-code-display" style="display:none;" data-i18n="room.waitingHost">Aguardando o dono da sala começar…</div>
      </div>

      <div class="track" id="track"></div>

      <div class="text-panel blurred" id="textPanel" style="display:none;">
        <div class="chars" id="textChars"></div>
        <div class="caret" id="caret"></div>
      </div>

      <div id="raceArea" style="display:none;">
        <input type="text" class="typing-input" id="typingInput" placeholder="A corrida ainda não começou…" data-i18n-placeholder="room.typingPlaceholderIdle" disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <div class="stats-row">
          <div class="stat"><div class="val" id="statWpm">0</div><div class="lbl" data-i18n="room.statWpm">PPM</div></div>
          <div class="stat"><div class="val" id="statAcc">100%</div><div class="lbl" data-i18n="room.statAccuracy">Precisão</div></div>
          <div class="stat"><div class="val" id="statProgress">0%</div><div class="lbl" data-i18n="room.statProgress">Progresso</div></div>
        </div>
      </div>

      <div id="resultsArea" style="display:none; margin-top: 20px;">
        <h2><i data-lucide="flag" class="icon"></i><span data-i18n="room.resultsHeading">Resultado da corrida</span></h2>
        <ul class="results-list" id="resultsList"></ul>
        <button class="btn btn-primary btn-block" id="restartBtn" data-i18n="room.restartButton">Nova corrida</button>
        <div class="room-code-display" id="waitingRestartMsg" style="display:none; text-align:center; margin-top:10px;" data-i18n="room.waitingRestart">Aguardando o dono da sala iniciar uma nova corrida…</div>
      </div>
    </div>

    <div class="panel chat-panel" id="chatPanel">
      <button type="button" class="chat-toggle" id="chatToggle">
        <h2 style="margin:0;"><i data-lucide="message-circle" class="icon"></i><span data-i18n="room.chatHeading">Chat da sala</span></h2>
        <span class="badge-pill chat-unread" id="chatUnreadBadge" style="display:none;">0</span>
        <i data-lucide="chevron-down" class="icon chat-chevron" id="chatChevron"></i>
      </button>
      <div id="chatBody">
        <ul class="chat-messages" id="chatMessages"></ul>
        <form class="chat-form" id="chatForm">
          <input type="text" id="chatInput" data-i18n-placeholder="room.chatPlaceholder" placeholder="Escreva uma mensagem…" maxlength="300" autocomplete="off" />
          <button class="btn btn-primary" type="submit" id="chatSendBtn"><i data-lucide="send" class="icon"></i></button>
        </form>
      </div>
    </div>
  </div>

  <div class="countdown-overlay" id="countdownOverlay">
    <div class="countdown-num" id="countdownNum">5</div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/theme-toggle.js"></script>
  <script src="/js/room.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
