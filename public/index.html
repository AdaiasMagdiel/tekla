<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="index.title">Tekla — Corrida de digitação ao vivo</title>
  <meta name="description" content="Entre em uma sala, digite mais rápido que seus amigos e vença a corrida. Ranking global, PPM e precisão em tempo real." data-i18n-content="index.description" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tekla" />
  <meta property="og:title" content="Tekla — Corrida de digitação ao vivo" data-i18n-content="index.ogTitle" />
  <meta property="og:description" content="Crie uma sala, chame seus amigos com um código curto e corra digitando em tempo real. Ranking, PPM e precisão." data-i18n-content="index.ogDescription" />
  <meta property="og:image" content="/img/og-image.svg" />
  <meta property="og:image:type" content="image/svg+xml" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tekla — Corrida de digitação ao vivo" data-i18n-content="index.twitterTitle" />
  <meta name="twitter:description" content="Crie uma sala, chame seus amigos com um código curto e corra digitando em tempo real." data-i18n-content="index.twitterDescription" />
  <meta name="twitter:image" content="/img/og-image.svg" />

  <script src="/js/i18n.js"></script>
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/"><i data-lucide="flag" class="icon icon-lg flag"></i><span class="brand-text">Te<span class="brand-hi">kla</span></span></a>
      <nav>
        <a href="/ranking"><i data-lucide="trophy" class="icon"></i><span data-i18n="nav.ranking">Ranking</span></a>
        <a href="/profile" id="profileLink" style="display:none;"><i data-lucide="user" class="icon"></i><span data-i18n="nav.profile">Meu perfil</span></a>
        <button class="btn btn-secondary" id="logoutBtn" style="display:none;"><i data-lucide="log-out" class="icon"></i><span data-i18n="index.logoutButton">Sair</span></button>
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"></button>
      </nav>
    </header>

    <div class="panel" id="authPanel">
      <h1 class="hero-title" data-i18n="index.heading">Corrida de digitação em tempo real</h1>
      <p class="sub" data-i18n="index.subtitle">Entre ou crie uma conta para correr contra seus amigos.</p>

      <div class="auth-tabs" style="display:flex; gap:8px; margin-bottom:16px;">
        <button type="button" class="btn btn-secondary" id="loginTabBtn" data-i18n="index.loginTab">Entrar</button>
        <button type="button" class="btn btn-secondary" id="registerTabBtn" data-i18n="index.registerTab">Criar conta</button>
      </div>

      <div class="grid-2">
        <div>
          <label for="username" data-i18n="index.usernameLabel">Nome de usuário</label>
          <input type="text" id="username" placeholder="ex: beremiz.samir" data-i18n-placeholder="index.usernamePlaceholder" maxlength="16" autocomplete="username" />
        </div>
        <div id="displayNameField">
          <label for="displayName" data-i18n="index.displayNameLabel">Seu nome</label>
          <input type="text" id="displayName" placeholder="ex: Adaías Magdiel" data-i18n-placeholder="index.displayNamePlaceholder" maxlength="40" autocomplete="off" />
        </div>
      </div>

      <div style="margin-top: 16px;">
        <label for="password" data-i18n="index.passwordLabel">Senha</label>
        <input type="password" id="password" data-i18n-placeholder="index.passwordPlaceholder" placeholder="mín. 8 caracteres" maxlength="200" autocomplete="current-password" />
      </div>

      <div style="margin-top: 20px;">
        <button class="btn btn-primary btn-block" id="authSubmitBtn" data-i18n="index.loginButton">Entrar</button>
      </div>

      <div class="error-box" id="errorBox"></div>
    </div>

    <div class="panel" id="appPanel" style="display:none;">
      <p class="sub" id="welcomeMsg"></p>

      <div style="margin-top: 8px;">
        <label data-i18n="index.chooseCharacterHeading">Escolha seu personagem</label>
        <div class="character-picker" id="characterPicker"></div>
      </div>

      <div class="grid-2" style="margin-top: 24px;">
        <div class="action-card">
          <h2 style="font-size:1rem;" data-i18n="index.createRoomHeading">Criar sala</h2>
          <button class="btn btn-primary btn-block" id="createBtn"><i data-lucide="flag" class="icon"></i><span data-i18n="index.createRoomButton">Criar sala nova</span></button>
        </div>
        <div class="action-card">
          <h2 style="font-size:1rem;" data-i18n="index.joinRoomHeading">Entrar com código</h2>
          <div class="input-group">
            <input type="text" id="roomCode" placeholder="ex: AB3D9K" data-i18n-placeholder="index.roomCodePlaceholder" maxlength="6" style="text-transform:uppercase;" autocomplete="off" />
            <button class="btn btn-secondary" id="joinBtn"><i data-lucide="log-in" class="icon"></i><span data-i18n="index.joinRoomButton">Entrar</span></button>
          </div>
        </div>
      </div>

      <div class="error-box" id="appErrorBox"></div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/theme-toggle.js"></script>
  <script src="/js/index.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
